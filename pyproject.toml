[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "borealis-dataverse-mcp"
version = "0.2.0"
description = "MCP server for discovering and inspecting research datasets in Borealis Dataverse"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
dependencies = [
  "mcp>=1.2,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1,<2"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
borealis-dataverse-mcp = "borealis_server:main"

[tool.setuptools]
py-modules = ["borealis_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
